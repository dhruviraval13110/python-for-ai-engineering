<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgCyc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="cycleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowPurp" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7b2fff"/>
    </marker>
  </defs>

  <rect width="720" height="280" fill="url(#bgCyc)"/>
  <rect x="0" y="0" width="720" height="1.5" fill="url(#cycleGrad)"/>
  <rect x="0" y="278.5" width="720" height="1.5" fill="url(#cycleGrad)"/>

  <!-- Center label -->
  <text x="360" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" filter="url(#glow3)">Engineering</text>
  <text x="360" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" filter="url(#glow3)">Loop</text>

  <!-- Rotating ring -->
  <circle cx="360" cy="140" r="95" fill="none" stroke="#1a2a5e" stroke-width="1.5"/>
  <circle cx="360" cy="140" r="95" fill="none" stroke="url(#cycleGrad)" stroke-width="1.5" stroke-dasharray="180,420" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 360 140;360 360 140" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Nodes around circle — 9 steps -->
  <!-- LEARN — top -->
  <g>
    <circle cx="360" cy="42" r="26" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="360" y="46" text-anchor="middle" font-size="9" font-weight="700" fill="#00d4ff">LEARN</text>
  </g>

  <!-- DERIVE — top right -->
  <g>
    <circle cx="449" cy="68" r="26" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="449" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#a78bff">DERIVE</text>
  </g>

  <!-- IMPLEMENT — right -->
  <g>
    <circle cx="455" cy="140" r="26" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="455" y="137" text-anchor="middle" font-size="9" font-weight="700" fill="#00d4ff">IMPLE-</text>
    <text x="455" y="149" text-anchor="middle" font-size="9" font-weight="700" fill="#00d4ff">MENT</text>
  </g>

  <!-- VISUALIZE — bottom right -->
  <g>
    <circle cx="449" cy="212" r="26" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="449" y="209" text-anchor="middle" font-size="9" font-weight="700" fill="#a78bff">VISU-</text>
    <text x="449" y="221" text-anchor="middle" font-size="9" font-weight="700" fill="#a78bff">ALIZE</text>
  </g>

  <!-- TEST — bottom -->
  <g>
    <circle cx="360" cy="238" r="26" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="360" y="242" text-anchor="middle" font-size="9" font-weight="700" fill="#00d4ff">TEST</text>
  </g>

  <!-- DEBUG — bottom left -->
  <g>
    <circle cx="271" cy="212" r="26" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="271" y="216" text-anchor="middle" font-size="9" font-weight="700" fill="#a78bff">DEBUG</text>
  </g>

  <!-- EXPLAIN — left -->
  <g>
    <circle cx="265" cy="140" r="26" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="265" y="144" text-anchor="middle" font-size="9" font-weight="700" fill="#00d4ff">EXPLAIN</text>
  </g>

  <!-- DOC — top left -->
  <g>
    <circle cx="271" cy="68" r="26" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5" filter="url(#glow3)">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <text x="271" y="65" text-anchor="middle" font-size="9" font-weight="700" fill="#a78bff">DOC-</text>
    <text x="271" y="77" text-anchor="middle" font-size="9" font-weight="700" fill="#a78bff">UMENT</text>
  </g>

  <!-- Travelling pulse -->
  <circle r="5" fill="#00d4ff" filter="url(#glow3)">
    <animateMotion path="M360,42 A95,95 0 1,1 359,42" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="360" y="20" text-anchor="middle" font-size="11" fill="#4466aa" letter-spacing="2">THE ENGINEERING LEARNING LOOP</text>
</svg>
