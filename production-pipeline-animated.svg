<svg viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgProd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0d1b3e"/>
      <stop offset="100%" style="stop-color:#0a0f1e"/>
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
    <filter id="glow5"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr5" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#00d4ff"/>
    </marker>
  </defs>

  <rect width="1200" height="160" fill="url(#bgProd)"/>
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#prodGrad)" opacity="0.7"/>
  <rect x="0" y="158.5" width="1200" height="1.5" fill="url(#prodGrad)" opacity="0.7"/>

  <text x="600" y="18" text-anchor="middle" font-size="11" fill="#4466aa" letter-spacing="2">PRODUCTION ML PIPELINE</text>

  <!-- Steps -->
  <g text-anchor="middle" font-size="9">
    <!-- stages: data, validate, features, model, evaluate, artifact, api, container, monitoring, feedback -->
    <!-- DATA -->
    <rect x="18" y="35" width="84" height="90" rx="7" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></rect>
    <text x="60" y="62" fill="#8899cc">RAW</text><text x="60" y="78" font-size="11" font-weight="700" fill="#00d4ff">DATA</text>
    <text x="60" y="95" fill="#8899cc">ingest</text><text x="60" y="110" fill="#8899cc">version</text>

    <line x1="103" y1="80" x2="119" y2="80" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#00d4ff"><animateMotion path="M103,80 L124,80" dur="1.8s" repeatCount="indefinite"/></circle>

    <!-- VALIDATE -->
    <rect x="122" y="35" width="88" height="90" rx="7" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></rect>
    <text x="166" y="62" fill="#8899cc">DATA</text><text x="166" y="78" font-size="11" font-weight="700" fill="#a78bff">VALIDATE</text>
    <text x="166" y="95" fill="#8899cc">schema</text><text x="166" y="110" fill="#8899cc">quality</text>

    <line x1="211" y1="80" x2="227" y2="80" stroke="#7b2fff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#7b2fff"><animateMotion path="M211,80 L232,80" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>

    <!-- FEATURES -->
    <rect x="230" y="35" width="88" height="90" rx="7" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></rect>
    <text x="274" y="62" fill="#8899cc">FEATURE</text><text x="274" y="78" font-size="11" font-weight="700" fill="#00d4ff">STORE</text>
    <text x="274" y="95" fill="#8899cc">transform</text><text x="274" y="110" fill="#8899cc">encode</text>

    <line x1="319" y1="80" x2="335" y2="80" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#00d4ff"><animateMotion path="M319,80 L340,80" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>

    <!-- MODEL -->
    <rect x="338" y="28" width="95" height="104" rx="7" fill="#0d1b3e" stroke="#00d4ff" stroke-width="2"><animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/></rect>
    <text x="385" y="55" fill="#8899cc">TRAIN +</text><text x="385" y="72" font-size="13" font-weight="700" fill="#ffffff">MODEL</text>
    <text x="385" y="90" fill="#8899cc">experiment</text><text x="385" y="106" fill="#8899cc">tracking</text><text x="385" y="121" fill="#8899cc">registry</text>

    <line x1="434" y1="80" x2="450" y2="80" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#00d4ff"><animateMotion path="M434,80 L455,80" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>

    <!-- EVAL -->
    <rect x="453" y="35" width="88" height="90" rx="7" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
    <text x="497" y="62" fill="#8899cc">OFFLINE</text><text x="497" y="78" font-size="11" font-weight="700" fill="#a78bff">EVAL</text>
    <text x="497" y="95" fill="#8899cc">metrics</text><text x="497" y="110" fill="#8899cc">baseline</text>

    <line x1="542" y1="80" x2="558" y2="80" stroke="#7b2fff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#7b2fff"><animateMotion path="M542,80 L563,80" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>

    <!-- API -->
    <rect x="561" y="35" width="88" height="90" rx="7" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/></rect>
    <text x="605" y="62" fill="#8899cc">REST</text><text x="605" y="78" font-size="11" font-weight="700" fill="#00d4ff">API</text>
    <text x="605" y="95" fill="#8899cc">FastAPI</text><text x="605" y="110" fill="#8899cc">schema</text>

    <line x1="650" y1="80" x2="666" y2="80" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.5s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#00d4ff"><animateMotion path="M650,80 L671,80" dur="1.8s" begin="1.5s" repeatCount="indefinite"/></circle>

    <!-- CONTAINER -->
    <rect x="669" y="35" width="88" height="90" rx="7" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></rect>
    <text x="713" y="62" fill="#8899cc">DOCKER</text><text x="713" y="78" font-size="11" font-weight="700" fill="#a78bff">CONTAINER</text>
    <text x="713" y="95" fill="#8899cc">CI/CD</text><text x="713" y="110" fill="#8899cc">deploy</text>

    <line x1="758" y1="80" x2="774" y2="80" stroke="#7b2fff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.8s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#7b2fff"><animateMotion path="M758,80 L779,80" dur="1.8s" begin="1.8s" repeatCount="indefinite"/></circle>

    <!-- MONITOR -->
    <rect x="777" y="35" width="96" height="90" rx="7" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></rect>
    <text x="825" y="62" fill="#8899cc">DRIFT</text><text x="825" y="78" font-size="11" font-weight="700" fill="#00d4ff">MONITOR</text>
    <text x="825" y="95" fill="#8899cc">alerts</text><text x="825" y="110" fill="#8899cc">rollback</text>

    <line x1="874" y1="80" x2="890" y2="80" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#arr5)"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="2.1s" repeatCount="indefinite"/></line>
    <circle r="2.5" fill="#00d4ff"><animateMotion path="M874,80 L895,80" dur="1.8s" begin="2.1s" repeatCount="indefinite"/></circle>

    <!-- FEEDBACK -->
    <rect x="893" y="35" width="96" height="90" rx="7" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></rect>
    <text x="941" y="62" fill="#8899cc">USER</text><text x="941" y="78" font-size="11" font-weight="700" fill="#a78bff">FEEDBACK</text>
    <text x="941" y="95" fill="#8899cc">retrain</text><text x="941" y="110" fill="#8899cc">signal</text>

    <!-- Loop back arrow -->
    <path d="M989,130 Q1050,150 1050,80 Q1050,25 600,25 Q200,25 105,80" stroke="#1a2a5e" stroke-width="1" fill="none" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="600" y="148" text-anchor="middle" font-size="9" fill="#4466aa">← continuous retraining loop →</text>
  </g>
</svg>
