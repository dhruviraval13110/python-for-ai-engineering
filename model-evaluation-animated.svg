<svg viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgEval" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0d1b3e"/>
      <stop offset="100%" style="stop-color:#0a0f1e"/>
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr4" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#00d4ff"/>
    </marker>
  </defs>

  <rect width="1200" height="180" fill="url(#bgEval)"/>
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#evalGrad)" opacity="0.7"/>
  <rect x="0" y="178.5" width="1200" height="1.5" fill="url(#evalGrad)" opacity="0.7"/>

  <!-- Title -->
  <text x="600" y="22" text-anchor="middle" font-size="11" fill="#4466aa" letter-spacing="2">ML EVALUATION PIPELINE</text>

  <!-- Pipeline steps -->
  <g text-anchor="middle">
    <!-- DATA -->
    <g>
      <rect x="30" y="45" width="100" height="80" rx="8" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="80" y="78" font-size="9" fill="#8899cc">RAW</text>
      <text x="80" y="93" font-size="12" font-weight="700" fill="#00d4ff">DATA</text>
      <text x="80" y="110" font-size="8" fill="#8899cc">Split</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze"/>
    </g>

    <!-- arrow -->
    <line x1="131" y1="85" x2="155" y2="85" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr4)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#00d4ff"><animateMotion path="M131,85 L160,85" dur="2s" repeatCount="indefinite"/></circle>

    <!-- PREPROCESS -->
    <g>
      <rect x="162" y="45" width="110" height="80" rx="8" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="217" y="78" font-size="9" fill="#8899cc">FEATURE</text>
      <text x="217" y="93" font-size="11" font-weight="700" fill="#a78bff">ENGINEER</text>
      <text x="217" y="110" font-size="8" fill="#8899cc">Scale · Encode</text>
    </g>

    <line x1="273" y1="85" x2="297" y2="85" stroke="#7b2fff" stroke-width="1.5" marker-end="url(#arr4)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#7b2fff"><animateMotion path="M273,85 L302,85" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>

    <!-- MODEL -->
    <g>
      <rect x="303" y="38" width="110" height="95" rx="8" fill="#0d1b3e" stroke="#00d4ff" stroke-width="2">
        <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="358" y="72" font-size="9" fill="#8899cc">TRAINED</text>
      <text x="358" y="90" font-size="14" font-weight="700" fill="#ffffff">MODEL</text>
      <text x="358" y="110" font-size="8" fill="#00d4ff">Fit · Predict</text>
      <text x="358" y="123" font-size="8" fill="#8899cc">CV · Tune</text>
    </g>

    <line x1="414" y1="85" x2="438" y2="85" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr4)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#00d4ff"><animateMotion path="M414,85 L443,85" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>

    <!-- METRICS -->
    <g>
      <rect x="444" y="45" width="110" height="80" rx="8" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="499" y="78" font-size="9" fill="#8899cc">EVALUATE</text>
      <text x="499" y="93" font-size="12" font-weight="700" fill="#a78bff">METRICS</text>
      <text x="499" y="110" font-size="8" fill="#8899cc">F1·AUC·RMSE</text>
    </g>

    <line x1="555" y1="85" x2="579" y2="85" stroke="#7b2fff" stroke-width="1.5" marker-end="url(#arr4)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#7b2fff"><animateMotion path="M555,85 L584,85" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>

    <!-- ERROR ANALYSIS -->
    <g>
      <rect x="585" y="45" width="120" height="80" rx="8" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="645" y="78" font-size="9" fill="#8899cc">ERROR</text>
      <text x="645" y="93" font-size="12" font-weight="700" fill="#00d4ff">ANALYSIS</text>
      <text x="645" y="110" font-size="8" fill="#8899cc">Confuse·Debug</text>
    </g>

    <line x1="706" y1="85" x2="730" y2="85" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arr4)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.6s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#00d4ff"><animateMotion path="M706,85 L735,85" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>

    <!-- EXPERIMENT -->
    <g>
      <rect x="736" y="45" width="120" height="80" rx="8" fill="#0d1b3e" stroke="#7b2fff" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="796" y="78" font-size="9" fill="#8899cc">NEXT</text>
      <text x="796" y="93" font-size="12" font-weight="700" fill="#a78bff">EXPERIMENT</text>
      <text x="796" y="110" font-size="8" fill="#8899cc">Baseline·Change</text>
    </g>

    <line x1="857" y1="85" x2="881" y2="85" stroke="#7b2fff" stroke-width="1.5" marker-end="url(#arr4)">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="2s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#7b2fff"><animateMotion path="M857,85 L886,85" dur="2s" begin="2s" repeatCount="indefinite"/></circle>

    <!-- DOCUMENT -->
    <g>
      <rect x="887" y="45" width="110" height="80" rx="8" fill="#0d1b3e" stroke="#00d4ff" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
      </rect>
      <text x="942" y="78" font-size="9" fill="#8899cc">DECIDE +</text>
      <text x="942" y="93" font-size="12" font-weight="700" fill="#00d4ff">DOCUMENT</text>
      <text x="942" y="110" font-size="8" fill="#8899cc">Ship or Iterate</text>
    </g>

    <!-- Feedback loop -->
    <path d="M997,130 Q1060,160 1060,85 Q1060,30 600,30 Q200,30 130,85" stroke="#1a2a5e" stroke-width="1" fill="none" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="600" y="165" text-anchor="middle" font-size="9" fill="#4466aa">← iterate until the decision is clear →</text>
  </g>
</svg>
